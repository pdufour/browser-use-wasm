<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Confirm — Action needed</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <article id="capture-target" class="page">
      <header class="page-header">
        <span class="brand">NovaDesk</span>
        <span class="status">Draft saved</span>
      </header>
      <main class="page-main">
        <h1>Project settings</h1>
        <p>Review your workspace before publishing changes to the team.</p>
        <ul class="checklist">
          <li>Notifications enabled</li>
          <li>Two collaborators invited</li>
        </ul>
      </main>
      <div class="modal-backdrop" aria-hidden="true"></div>
      <div class="modal" role="dialog" aria-label="Confirm changes">
        <h2>Save changes?</h2>
        <p>Your edits will be applied to the shared workspace.</p>
        <div class="modal-actions">
          <button type="button" class="btn btn-cancel">Cancel</button>
          <button type="button" class="btn btn-ok">OK</button>
        </div>
      </div>
    </article>
  </body>
</html>
