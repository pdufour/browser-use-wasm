<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Color Pick — Quick actions</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <article id="capture-target" class="page">
      <header class="header">
        <h1>Pick a color</h1>
        <p>Tap the button that matches the prompt.</p>
      </header>
      <div class="button-row">
        <button type="button" class="color-btn color-btn--red">Red</button>
        <button type="button" class="color-btn color-btn--blue">Blue</button>
        <button type="button" class="color-btn color-btn--green">Green</button>
        <button type="button" class="color-btn color-btn--yellow">Yellow</button>
        <button type="button" class="color-btn color-btn--orange">Orange</button>
      </div>
    </article>
  </body>
</html>
