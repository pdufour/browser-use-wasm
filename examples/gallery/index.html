<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pick a demo — browser AI tasks</title>
    <link rel="stylesheet" href="../shared/brainwave.css" />
    <link rel="stylesheet" href="../shared/user-facing.css" />
    <link rel="stylesheet" href="../shared/site-header.css" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body class="gallery-page">
    <header id="site-header"></header>
    <section class="gallery-intro">
      <h1>Example tasks</h1>
      <p class="gallery-lead">
        Each card opens a sample page with a preset goal. Edit the goal, hit Run, and watch the
        model click or type on the live page.
      </p>
    </section>

    <main id="gallery-grid" class="gallery-grid" aria-live="polite"></main>

    <footer class="gallery-footer">
      <p><code>npm run dev</code> in Chrome or Edge · <code>npm run cache:model</code> once</p>
    </footer>

    <script type="module" src="./main.js"></script>
  </body>
</html>
