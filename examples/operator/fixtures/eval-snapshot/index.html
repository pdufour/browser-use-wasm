<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Eval snapshot</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: #fff;
        overflow: hidden;
      }
      /* Same SnapDOM root as browse-fixture — no letterboxing around the shot */
      #capture-target {
        margin: 0;
        padding: 0;
        display: block;
        width: 100%;
        line-height: 0;
        overflow: hidden;
      }
      #eval-shot {
        display: block;
        width: 100%;
        height: auto;
        vertical-align: top;
      }
    </style>
  </head>
  <body>
    <div id="capture-target">
      <img id="eval-shot" data-testid="eval-shot" alt="" />
    </div>
    <script>
      const params = new URLSearchParams(location.search);
      const src = params.get('src');
      const img = document.getElementById('eval-shot');
      const shrinkToImage = () => {
        const w = img.offsetWidth;
        if (!w || !img.naturalWidth) return;
        const h = Math.round((w * img.naturalHeight) / img.naturalWidth);
        img.style.height = `${h}px`;
        document.documentElement.style.height = `${h}px`;
        document.body.style.height = `${h}px`;
      };
      img.addEventListener('load', () => {
        requestAnimationFrame(() => requestAnimationFrame(shrinkToImage));
      });
      if (src) img.src = src;
    </script>
  </body>
</html>
