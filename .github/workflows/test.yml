name: E2E

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  submit-grounding:
    name: Submit finds green button
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Cache ShowUI GGUF weights
        uses: actions/cache@v4
        with:
          path: .model-cache
          key: showui-model-${{ hashFiles('src/vl-config.js', 'src/showui-config.js', 'scripts/cache-model.mjs') }}
          restore-keys: |
            showui-model-

      - run: npm ci
      - run: npm ci --prefix examples

      - name: Install Playwright Chrome (WebGPU)
        run: npx playwright install chrome --with-deps

      - name: Download model cache if missing
        run: npm run cache:showui

      - name: Download MAI-UI-2B for model-switch E2E
        run: npm run cache:model -- --model MAI-UI-2B

      - name: E2E — autoload, capture, Submit, green circle
        run: npm run test
        env:
          CI: true

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
