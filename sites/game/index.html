<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GridStrike — Tic-tac-toe</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <article id="capture-target" class="page">
      <header class="game-header">
        <span class="badge">GridStrike</span>
        <h1>Your turn — place X</h1>
        <p class="score">You 2 · CPU 1</p>
      </header>
      <div class="board" role="grid" aria-label="Tic-tac-toe board">
        <button type="button" class="cell" aria-label="Top left">O</button>
        <button type="button" class="cell" aria-label="Top center">X</button>
        <button type="button" class="cell" aria-label="Top right">O</button>
        <button type="button" class="cell" aria-label="Middle left">X</button>
        <button type="button" class="cell cell--center" aria-label="Center"> </button>
        <button type="button" class="cell" aria-label="Middle right">O</button>
        <button type="button" class="cell" aria-label="Bottom left"> </button>
        <button type="button" class="cell" aria-label="Bottom center">X</button>
        <button type="button" class="cell" aria-label="Bottom right"> </button>
      </div>
    </article>
  </body>
</html>
