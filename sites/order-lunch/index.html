<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LunchBox — Order lunch</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <article id="capture-target" class="page">
      <header class="banner">
        <h1>LunchBox</h1>
        <p>Fresh meals, ready in 15 minutes.</p>
      </header>
      <section class="menu">
        <article class="menu-card">
          <h2>Classic Burger</h2>
          <p>Angus beef, cheddar, pickles, brioche bun.</p>
          <span class="price">$12</span>
          <button type="button" class="order-btn">Order burger</button>
        </article>
        <article class="menu-card">
          <h2>Garden Salad</h2>
          <p>Mixed greens, tomatoes, balsamic.</p>
          <span class="price">$9</span>
          <button type="button" class="order-btn">Order salad</button>
        </article>
        <article class="menu-card">
          <h2>Margherita Pizza</h2>
          <p>Tomato, mozzarella, fresh basil.</p>
          <span class="price">$14</span>
          <button type="button" class="order-btn">Order pizza</button>
        </article>
      </section>
    </article>
  </body>
</html>
