<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Inbox — Mailwave</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <article id="capture-target" class="page">
      <header class="inbox-header">
        <h1>Inbox</h1>
        <span class="count">3 messages</span>
      </header>
      <ul class="mail-list">
        <li class="mail-item">
          <button type="button" class="star-btn" aria-label="Mark important">☆</button>
          <div class="mail-body">
            <span class="sender">Alex Chen</span>
            <span class="subject">Q2 planning review</span>
            <span class="preview">Can we sync on the roadmap before Friday?</span>
          </div>
        </li>
        <li class="mail-item">
          <button type="button" class="star-btn" aria-label="Mark important">☆</button>
          <div class="mail-body">
            <span class="sender">Billing</span>
            <span class="subject">Your receipt</span>
            <span class="preview">Thanks for your subscription renewal.</span>
          </div>
        </li>
        <li class="mail-item">
          <button type="button" class="star-btn" aria-label="Mark important">☆</button>
          <div class="mail-body">
            <span class="sender">Newsletter</span>
            <span class="subject">Weekly digest</span>
            <span class="preview">Top stories from this week.</span>
          </div>
        </li>
      </ul>
    </article>
  </body>
</html>
