<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fractional pixels - floor / round / ceil</title>
    <style>
      body { margin: 0; font-family: Inter, system-ui, sans-serif; background: #f8fafc; padding: 1.5rem; }
      .export-card { max-width: 52rem; margin: 0 auto; background: #fff; border: 1px solid #e8ecf1; border-radius: 16px; padding: 1.25rem; }
      .dpr-frac__measure { position: absolute; left: -9999px; width: 280px; }
      .dpr-frac__math { display: flex; flex-wrap: wrap; gap: 0.5rem; padding: 0.9rem; border: 1px solid #cbd5e1; border-radius: 12px; background: #f8fafc; margin-bottom: 1rem; }
      .dpr-frac__round-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.85rem; }
      .dpr-frac__round-col { padding: 0.75rem; border: 1px solid #e2e8f0; border-radius: 12px; }
      .dpr-frac__formula { font-family: ui-monospace, Menlo, monospace; font-size: 0.82rem; font-weight: 700; }
      .dpr-frac__round-thumb { border: 1px solid #e2e8f0; border-radius: 8px; overflow: hidden; max-height: 120px; margin: 0.5rem 0; }
      .dpr-frac__round-bitmap { display: block; width: 100%; height: auto; }
      .dpr-frac__caption { margin-top: 0.85rem; font-size: 0.8rem; color: #475569; }
      @media (max-width: 720px) { .dpr-frac__round-grid { grid-template-columns: 1fr; } }
    </style>
  </head>
  <body>
    <div id="dpr-rounding-export-root" class="export-card">
      <div class="dpr-frac">
        <div class="dpr-frac__measure" aria-hidden="true">
          <article id="dpr-frac-stage" class="dpr-frac__panel" style="width: 280px; height: 316.3px">
            <h3>Complete your order</h3>
            <p>Review details before you submit.</p>
          </article>
        </div>
        <div class="dpr-frac__math" id="dpr-frac-math">Measuring…</div>
        <div class="dpr-frac__round-grid" id="dpr-frac-round-grid"></div>
        <p class="dpr-frac__caption" id="dpr-frac-caption">Capturing…</p>
      </div>
    </div>
    <script type="module">
      import { initDprRoundingDemo } from './dpr-rounding-demo.mjs';
      await initDprRoundingDemo();
    </script>
  </body>
</html>
